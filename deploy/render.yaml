# Render Blueprint for RapidGarage (see DEPLOY.md). In the dashboard choose
# New > Blueprint, pick the repo and set the Blueprint path to
# deploy/render.yaml (or copy this file to the repo root as render.yaml).
# Values marked sync: false are asked for when the Blueprint is applied.
services:
  - type: web
    name: rapidgarage
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: starter                    # paid plan: needed for the disk and preDeployCommand
    region: virginia
    healthCheckPath: /readyz
    preDeployCommand: node scripts/release.js
    disk:
      name: uploads
      mountPath: /data/uploads
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: rapidgarage-db
          property: connectionString   # internal URL, private network
      - key: DATABASE_SSL
        value: "off"
      - key: RUN_MIGRATIONS
        value: "false"                 # preDeployCommand does it
      - key: TRUST_PROXY
        value: "1"                     # check with DEBUG_PROXY (DEPLOY.md)
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: SESSION_SECRET
        generateValue: true
      - key: KEY_ENCRYPTION_SECRET
        generateValue: true
      - key: APP_BASE_URL
        sync: false                    # https://<your domain or name.onrender.com>
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: GOOGLE_GEOCODING_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CALLBACK_URL
        sync: false                    # <APP_BASE_URL>/api/auth/google/callback
      - key: ADMIN_EMAILS
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: rapidgarage-db
    plan: basic-256mb
    region: virginia
    databaseName: rapidgarage
    user: rapidgarage
    postgresMajorVersion: "17"
    ipAllowList: []                    # no public access; only Render services
